<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生地图 - 修仙人生模拟器</title>
<style>
/* 修仙主题CSS */
:root{--bg-deep:#0a0a14;--bg-panel:rgba(12,12,28,0.94);--bg-panel-light:rgba(18,18,38,0.88);--gold:#d4a574;--gold-light:#f0d9b5;--gold-dark:#b8863a;--jade:#5dbea3;--jade-light:#7ed8bf;--jade-dark:#3d8b7a;--text:#c4b998;--text-bright:#f0e6d3;--text-dim:#7a7260;--danger:#c0392b;--danger-light:#e74c3c;--rare:#9b59b6;--rare-light:#b07cd8;--border:rgba(212,165,116,0.25);--border-glow:rgba(212,165,116,0.5);--font-cn:'KaiTi','STKaiti','Microsoft YaHei','SimSun',serif;--font-title:'KaiTi','STKaiti','SimSun',serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-cn);background:var(--bg-deep);color:var(--text);user-select:none}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 10px rgba(212,165,116,.3)}50%{text-shadow:0 0 30px rgba(212,165,116,.7),0 0 60px rgba(212,165,116,.3)}}
@keyframes floatAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes breakthroughAnim{0%{filter:brightness(1);transform:scale(1)}30%{filter:brightness(2.5);transform:scale(1.05)}70%{filter:brightness(1.8);transform:scale(1.02)}100%{filter:brightness(1);transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
.fade-in{animation:fadeIn .4s ease forwards}.fade-in-up{animation:fadeInUp .6s ease forwards}
.slide-in-left{animation:slideInLeft .5s ease forwards}.slide-in-right{animation:slideInRight .5s ease forwards}
.glow-pulse{animation:glowPulse 3s ease-in-out infinite}.float-anim{animation:floatAnim 3s ease-in-out infinite}
#homeScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}#homeScreen:not(.active){display:none}
#homeScreen .game-title{font-family:var(--font-title);font-size:clamp(48px,8vw,96px);color:var(--gold-light);letter-spacing:.15em;animation:glowPulse 3s ease-in-out infinite,fadeIn 1.2s ease;margin-bottom:12px;text-shadow:0 0 40px rgba(212,165,116,.4),0 0 80px rgba(212,165,116,.2)}
#homeScreen .game-subtitle{font-family:var(--font-title);font-size:clamp(18px,2.5vw,28px);color:var(--text);letter-spacing:.25em;animation:fadeIn 1.5s ease;margin-bottom:60px}
#homeScreen .decoration-line{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 30px;animation:fadeIn 2s ease}
.btn-primary{font-family:var(--font-cn);font-size:22px;letter-spacing:.2em;color:var(--bg-deep);background:linear-gradient(135deg,var(--jade),var(--jade-dark));border:2px solid var(--jade-light);padding:16px 64px;border-radius:8px;cursor:pointer;transition:all .4s ease}
.btn-primary:hover{background:linear-gradient(135deg,var(--jade-light),var(--jade));box-shadow:0 0 30px rgba(93,190,163,.5),0 0 60px rgba(93,190,163,.2);transform:translateY(-3px)}
.btn-primary:active{transform:translateY(0)}
.btn-gold{font-family:var(--font-cn);font-size:20px;letter-spacing:.2em;color:var(--bg-deep);background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:2px solid var(--gold-light);padding:14px 60px;border-radius:8px;cursor:pointer;transition:all .4s ease}
.btn-gold:hover{box-shadow:0 0 30px rgba(212,165,116,.5),0 0 60px rgba(212,165,116,.2);transform:translateY(-2px)}
.btn-gold:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{font-family:var(--font-cn);font-size:13px;color:var(--text-bright);background:var(--bg-panel-light);border:1px solid var(--border);padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .2s ease}
.btn-sm:hover{border-color:var(--gold);color:var(--gold-light)}
.btn-sm.danger{color:var(--danger-light);border-color:rgba(192,57,43,.3)}
.btn-sm.danger:hover{border-color:var(--danger);background:rgba(192,57,43,.1)}
.btn-reroll{font-family:var(--font-cn);font-size:14px;color:var(--text-bright);background:transparent;border:1px solid var(--border);padding:6px 20px;border-radius:4px;cursor:pointer;transition:all .2s ease;margin-left:12px}
.btn-reroll:hover{border-color:var(--gold);color:var(--gold-light)}
#createScreen{display:none;width:100%;height:100%;overflow-y:auto;padding:40px 20px}
#createScreen.active{display:flex;flex-direction:column;align-items:center}
.create-container{max-width:900px;width:100%;animation:fadeIn .6s ease}
.create-title{text-align:center;font-family:var(--font-title);font-size:32px;color:var(--gold-light);letter-spacing:.15em;margin-bottom:30px}
.create-section{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.create-section h3{font-family:var(--font-title);color:var(--gold);font-size:20px;letter-spacing:.1em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.info-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:8px 0;font-size:16px}
.info-label{color:var(--text-dim);min-width:70px}
.info-value{color:var(--text-bright);font-weight:bold;padding:4px 12px;background:rgba(212,165,116,.1);border:1px solid var(--border);border-radius:4px}
.info-value.rare{color:var(--rare-light);border-color:rgba(155,89,182,.3);background:rgba(155,89,182,.1)}
.info-value.gold{color:var(--gold-light);border-color:var(--border-glow);background:rgba(212,165,116,.15)}
.stat-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.stat-name{width:60px;color:var(--text-bright);font-size:16px;text-align:right}
.stat-bar-container{flex:1;height:24px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.stat-bar-fill{height:100%;background:linear-gradient(90deg,var(--jade-dark),var(--jade));transition:width .4s ease;border-radius:4px}
.stat-ctrl{display:flex;gap:4px}
.stat-btn{width:30px;height:30px;font-size:18px;line-height:1;background:var(--bg-panel-light);border:1px solid var(--border);color:var(--text-bright);cursor:pointer;border-radius:4px;transition:all .2s ease}
.stat-btn:hover{border-color:var(--jade);color:var(--jade-light)}
.stat-btn:disabled{opacity:.3;cursor:not-allowed}
.stat-value{width:30px;text-align:center;color:var(--jade-light);font-weight:bold;font-size:16px}
.points-remain{text-align:right;color:var(--gold);font-size:15px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.talent-card{background:var(--bg-panel-light);border:2px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .2s ease}
.talent-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.talent-card.selected{border-color:var(--jade);background:rgba(93,190,163,.1);box-shadow:0 0 15px rgba(93,190,163,.2)}
.talent-card .talent-name{font-size:16px;color:var(--text-bright);font-weight:bold;margin-bottom:4px}
.talent-card .talent-grade{font-size:12px;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px}
.talent-card .talent-desc{font-size:13px;color:var(--text-dim);line-height:1.5}
.grade-ss{background:rgba(255,215,0,.2);color:#ffd700;border:1px solid rgba(255,215,0,.3)}
.grade-s{background:rgba(212,165,116,.2);color:var(--gold-light);border:1px solid var(--border)}
.grade-a{background:rgba(155,89,182,.2);color:var(--rare-light);border:1px solid rgba(155,89,182,.3)}
.grade-b{background:rgba(93,190,163,.15);color:var(--jade-light);border:1px solid rgba(93,190,163,.2)}
.grade-c{background:rgba(120,120,120,.15);color:#aaa;border:1px solid rgba(120,120,120,.2)}
.talent-count{text-align:center;color:var(--gold);font-size:15px;margin:12px 0}
#gameScreen{display:none;width:100%;height:100%}
#gameScreen.active{display:flex}
.left-panel{width:280px;min-width:280px;height:100%;background:var(--bg-panel);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;overflow-y:auto;animation:slideInLeft .5s ease;z-index:2}
.panel-header{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.panel-header .char-name{font-family:var(--font-title);font-size:26px;color:var(--gold-light);letter-spacing:.1em}
.panel-header .char-realm{font-size:15px;color:var(--jade-light);margin-top:6px}
.stat-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px}
.stat-item .s-label{color:var(--text-dim)}.stat-item .s-value{color:var(--text-bright);font-weight:bold}
.stat-item .s-value.gold{color:var(--gold-light)}
.title-list{margin-top:12px}
.title-tag{display:inline-block;font-size:12px;padding:3px 10px;background:rgba(212,165,116,.1);border:1px solid var(--border);border-radius:12px;color:var(--gold);margin:3px 4px 3px 0}
.center-area{flex:1;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top-bar{padding:12px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:2}
.top-bar .age-display{font-family:var(--font-title);font-size:20px;color:var(--gold-light)}
.top-bar .year-display{font-size:14px;color:var(--text-dim)}
.top-bar .btn-group{display:flex;gap:8px}
.event-log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.log-entry{background:var(--bg-panel-light);border:1px solid var(--border);border-radius:8px;padding:14px 18px;animation:fadeIn .4s ease;font-size:15px;line-height:1.7}
.log-entry .log-year{color:var(--gold);font-weight:bold;margin-right:8px}
.log-entry.normal{border-left:3px solid var(--text-dim)}
.log-entry.good{border-left:3px solid var(--jade)}
.log-entry.great{border-left:3px solid var(--gold);background:rgba(212,165,116,.05)}
.log-entry.danger{border-left:3px solid var(--danger)}
.log-entry.rare{border-left:3px solid var(--rare-light)}
.log-entry.breakthrough{border-left:3px solid var(--gold-light);background:rgba(212,165,116,.08);animation:breakthroughAnim .6s ease}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease}
.modal-box{background:var(--bg-panel);border:1px solid var(--border-glow);border-radius:12px;padding:30px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;animation:fadeInUp .4s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
.modal-box h2{font-family:var(--font-title);color:var(--gold-light);text-align:center;margin-bottom:16px;letter-spacing:.1em}
.modal-box p{line-height:1.8;margin-bottom:10px;color:var(--text)}
.modal-box .btn-close{display:block;margin:20px auto 0;font-family:var(--font-cn);font-size:16px;color:var(--text-bright);background:var(--bg-panel-light);border:1px solid var(--border);padding:10px 40px;border-radius:8px;cursor:pointer;transition:all .2s ease}
.modal-box .btn-close:hover{border-color:var(--gold);color:var(--gold-light)}
.battle-log{font-family:Consolas,monospace;font-size:13px;line-height:1.8;color:var(--text);padding:12px;background:rgba(0,0,0,.3);border-radius:4px;max-height:300px;overflow-y:auto;white-space:pre-wrap}
#endingScreen{display:none;width:100%;height:100%;overflow-y:auto;padding:40px 20px}
#endingScreen.active{display:flex;flex-direction:column;align-items:center}
.ending-container{max-width:800px;width:100%;animation:fadeIn .8s ease;background:var(--bg-panel);border:1px solid var(--border-glow);border-radius:12px;padding:40px}
.ending-title{text-align:center;font-family:var(--font-title);font-size:36px;color:var(--gold-light);letter-spacing:.15em;margin-bottom:8px}
.ending-grade{text-align:center;font-size:22px;color:var(--jade-light);margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.ending-section{margin-bottom:20px}
.ending-section h3{color:var(--gold);font-size:18px;margin-bottom:10px}
.ending-timeline{max-height:300px;overflow-y:auto;padding-right:10px}
.ending-timeline .tl-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:14px}
.ending-timeline .tl-age{color:var(--gold);font-weight:bold;margin-right:8px}
.fx-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;padding:12px 30px;background:var(--bg-panel);border:1px solid var(--border-glow);border-radius:8px;color:var(--text-bright);font-size:15px;animation:fadeIn .3s ease,fadeOut .5s ease 2s forwards;pointer-events:none}
.btn-continue{margin:16px auto;display:block;font-family:var(--font-cn);font-size:16px;letter-spacing:.1em;color:var(--bg-deep);background:linear-gradient(135deg,var(--jade),var(--jade-dark));border:1px solid var(--jade-light);padding:10px 40px;border-radius:8px;cursor:pointer;transition:all .4s ease}
.btn-restart{display:block;margin:30px auto 0;font-family:var(--font-cn);font-size:20px;letter-spacing:.2em;color:var(--bg-deep);background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:2px solid var(--gold-light);padding:14px 60px;border-radius:8px;cursor:pointer;transition:all .4s ease}
.btn-restart:hover{box-shadow:0 0 30px rgba(212,165,116,.5);transform:translateY(-2px)}
#simControls{display:none;padding:10px 20px;background:var(--bg-panel);border-top:1px solid var(--border);gap:8px;justify-content:center;z-index:2}
#pausePrompt{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;background:var(--bg-panel);border:1px solid var(--border-glow);border-radius:12px;padding:16px 30px;text-align:center}
@media(max-width:768px){#gameScreen.active{flex-direction:column}.left-panel{width:100%;min-width:0;height:auto;max-height:35%;flex-shrink:0}.center-area{height:65%}}

</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="app">
<div id="homeScreen" class="active">
<div class="title-container">
<div class="game-title">人生地图</div>
<div class="decoration-line"></div>
<div class="game-subtitle">一念凡尘，一步飞升。</div>
<button class="btn-primary" onclick="Game.startNewGame()">踏入仙途</button>
</div>
</div>
<div id="createScreen">
<div class="create-container">
<div class="create-title">—— 天命初现 ——</div>
<div class="create-section" id="basicInfo"></div>
<div class="create-section" id="statsSection"></div>
<div class="create-section" id="talentSection"></div>
<button class="btn-gold" id="btnStartLife" disabled onclick="Game.confirmCreate()">开始人生</button>
</div>
</div>
<div id="gameScreen">
<div class="left-panel" id="leftPanel"></div>
<div class="center-area">
<div class="top-bar">
<span class="age-display" id="ageDisplay">1岁</span>
<span class="year-display" id="yearDisplay"></span>
<div class="btn-group">
<button class="btn-sm danger" onclick="Game.restart()">再入轮回</button>
</div>
</div>
<div class="event-log" id="eventLog"></div>
<div id="simControls" style="display:none">
<button class="btn-sm" onclick="LifeSimulator.fastForward()">快进</button>
<button class="btn-sm" onclick="LifeSimulator.normalSpeed()">常速</button>
<button class="btn-sm danger" onclick="Game.restart()">放弃修仙</button>
</div>
<div id="pausePrompt">
<p id="pauseText" style="color:var(--gold-light);font-size:16px;margin-bottom:10px"></p>
<button class="btn-primary" onclick="LifeSimulator.resume()" style="font-size:14px;padding:8px 30px">继续推演</button>
</div>
</div>
</div>
<div id="endingScreen">
<div class="ending-container" id="endingContent"></div>
</div>
</div>
<div id="modalContainer"></div>
<div class="fx-layer" id="fxLayer"></div>
<script>
const CONFIG={SAVE_KEY:'life_map_save',TOTAL_STAT_POINTS:20,MAX_STAT:15,MIN_STAT:1,INITIAL_AGE:1,INITIAL_LIFESPAN:60,INITIAL_SPIRIT_STONES:100,TALENT_POOL_SIZE:10,TALENT_SELECT_COUNT:3,BASE_CULTIVATION_RATE:100,SIM_SPEED:800,SIM_FAST_SPEED:100,EVENT_CHANCE_PER_YEAR:1.0,COMBAT_DEATH_BASE:0.05};
const Utils={randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min},rand(){return Math.random()},pick(arr){return arr[Utils.randInt(0,arr.length-1)]},pickN(arr,n){const s=[...arr];for(let i=s.length-1;i>0;i--){const j=Utils.randInt(0,i);[s[i],s[j]]=[s[j],s[i]]}return s.slice(0,n)},chance(prob){return Utils.rand()<prob},clamp(v,min,max){return Math.max(min,Math.min(max,v))}};
const DATA={};
DATA.DAO_NAMES={prefixes:["清","云","玄","长","太","归","紫","玉","苍","青","白","金","丹","天","灵","无","虚","道","明","妙","神","圣","仙","真","古","上","元","通","慧","静","飞","寒","碧","赤","幽","素","风","雷","火","冰","星","月","日","霄","极","九","三","万","千","百","浩","混","鸿","逍遥","太一","悟","觉","空"],suffixes:["玄","逸","尘","歌","虚","元","阳","真","清","明","霄","微","风","云","羽","机","华","辰","心","灵","道","仙","子","君","尊","圣","天","渊","然","空","一","极","远","行","寂","宁","和","安","遥","恒","长","初","凡","生"],generate(){return Utils.pick(this.prefixes)+Utils.pick(this.suffixes)}};
DATA.SPIRIT_ROOTS={types:["金","木","水","火","土","雷","风","冰"],generate(){const r=Utils.rand();if(r<0.03)return{name:"天灵根",elements:Utils.pickN(this.types,1),speed:3.0,breakthroughBonus:0.25,grade:"ss"};if(r<0.08)return{name:"变异灵根",elements:Utils.pickN(this.types,Utils.randInt(1,2)),speed:2.5,breakthroughBonus:0.20,grade:"s"};if(r<0.25)return{name:"单灵根",elements:Utils.pickN(this.types,1),speed:2.0,breakthroughBonus:0.15,grade:"a"};if(r<0.55)return{name:"双灵根",elements:Utils.pickN(this.types,2),speed:1.5,breakthroughBonus:0.10,grade:"b"};if(r<0.85)return{name:"三灵根",elements:Utils.pickN(this.types,3),speed:1.0,breakthroughBonus:0.05,grade:"c"};return{name:"杂灵根",elements:Utils.pickN(this.types,Utils.randInt(4,5)),speed:0.6,breakthroughBonus:0.0,grade:"c"}}};

      const r=CombatEngine.simulate(this.char,evt.results.difficulty||'medium');if(r.death){this.char.alive=false;this.char.deathReason=Utils.pick(["力战而竭，陨落于敌手。","不敌对手，含恨而终。","重伤不治，魂归天地。","被强敌斩杀，修仙路尽。","寡不敌众，战死沙场。"]);UIManager.addLogEntry(this.char.age,evt.description+"——战败身亡！",'danger');this.endSimulation();return evt}UIManager.addLogEntry(this.char.age,evt.description+"（"+r.log+"）",r.victory?'good':'danger');if(r.injured)this.char.stats.constitution=Math.max(1,this.char.stats.constitution-1);this.char.timeline.push({age:this.char.age,event:evt.description,type:evt.category});return evt}return this.applyEventResults(evt)},applyEventResults(evt){const r=evt.results;if(r.spiritStones)this.char.spiritStones+=r.spiritStones;if(r.cultivationExp)this.char.cultivationExp+=r.cultivationExp;if(r.constitution)this.char.stats.constitution=Utils.clamp(this.char.stats.constitution+r.constitution,1,20);if(r.intelligence)this.char.stats.intelligence=Utils.clamp(this.char.stats.intelligence+r.intelligence,1,20);if(r.luck)this.char.stats.luck=Utils.clamp(this.char.stats.luck+r.luck,1,20);if(r.lifespan){this.char.lifespan+=r.lifespan;this.char.maxLifespan+=r.lifespan}if(r.eventFlag)this.char.eventFlags[r.eventFlag]=true;if(r.artifact)this.char.inventory.artifacts.push({name:r.artifact});if(r.pill)this.char.inventory.pills.push({name:r.pill});if(r.technique)this.char.inventory.techniques.push({name:r.technique});if(r.sect){this.char.sect=r.sect;this.char.sectRank="外门";if(r.sectAlign)this.char.sectAlign=r.sectAlign}if(r.sectRank)this.char.sectRank=r.sectRank;if(r.title&&!this.char.titles.includes(r.title))this.char.titles.push(r.title);if(r.reputation)this.char.reputation+=r.reputation;if(r.companion)this.char.companions.push("道友");
    if(r.revive){const rt=this.char.talents.find(t=>t.effects.revive);if(rt)rt.effects.revive=(rt.effects.revive||0)+1}
    if(r.speedBonus)this.char.stats.luck=Utils.clamp(this.char.stats.luck+1,1,20);
    if(r.combatExp)this.char.cultivationExp+=(r.combatExp||0);
    if(r.healRate)this.char.stats.constitution=Utils.clamp(this.char.stats.constitution+1,1,20);
    if(r.defenseBonus)this.char.stats.constitution=Utils.clamp(this.char.stats.constitution+1,1,20);if(r.danger&&Utils.chance(0.2))this.char.stats.constitution=Math.max(1,this.char.stats.constitution-1);this.char.timeline.push({age:this.char.age,event:evt.description,type:evt.category});const cc={adventure:'good',cultivate:'normal',combat:'great',social:'rare',disaster:'danger',sect:'great',craft:'good',market:'good',lifespan:'danger'}[evt.category]||'normal';UIManager.addLogEntry(this.char.age,evt.description,cc);return evt},generateDaily(){if(Utils.chance(0.5))return"潜心修炼，修为稳步增长。";return Utils.pick(["研习功法，略有心得。","打坐练气，感悟天地。","闭关修炼，一心向道。","游历四方，增长见闻。","与道友论道，获益匪浅。","在修炼中度过平静的一年。","感悟到了一丝天道真意。","道基愈发稳固。"])},resume(){this.isPaused=false;UIManager.hidePausePrompt();this.scheduleNext()},fastForward(){this.speed=CONFIG.SIM_FAST_SPEED;if(this.isPaused)this.resume()},normalSpeed(){this.speed=CONFIG.SIM_SPEED},endSimulation(){this.isRunning=false;if(this.timer)clearTimeout(this.timer);UIManager.showControls(false);UIManager.renderEnding(this.char)},stop(){this.isRunning=false;if(this.timer)clearTimeout(this.timer)}};

const UIManager={renderCreateScreen(char,talents){document.getElementById('basicInfo').innerHTML='<h3>天命信息</h3><div class="info-row"><span class="info-label">道号：</span><span class="info-value gold">'+char.name+'</span><button class="btn-reroll" onclick="Game.rerollName()">重选道号</button></div><div class="info-row"><span class="info-label">灵根：</span><span class="info-value rare">'+char.spiritRoot.name+'（'+char.spiritRoot.elements.join('·')+'）</span><button class="btn-reroll" onclick="Game.rerollRoot()">重选灵根</button></div><div class="info-row"><span class="info-label">初始寿元：</span><span class="info-value">'+char.lifespan+'</span></div><div class="info-row"><span class="info-label">初始灵石：</span><span class="info-value gold">'+char.spiritStones+'</span></div>';const stats=['family','intelligence','constitution','luck'];const sn={family:'家境',intelligence:'智力',constitution:'体质',luck:'运气'};let sh='<h3>属性分配（剩余点数：<span id="remainPoints" class="points-remain">'+char.getRemainingPoints()+'</span>）</h3>';for(const s of stats){sh+='<div class="stat-row"><span class="stat-name">'+sn[s]+'</span><div class="stat-bar-container"><div class="stat-bar-fill" id="bar_'+s+'" style="width:'+(char.stats[s]/CONFIG.MAX_STAT*100)+'%"></div></div><div class="stat-ctrl"><button class="stat-btn" onclick="Game.adjustStat(\''+s+'\',-1)">-</button><span class="stat-value" id="val_'+s+'">'+char.stats[s]+'</span><button class="stat-btn" onclick="Game.adjustStat(\''+s+'\',1)">+</button></div></div>'}document.getElementById('statsSection').innerHTML=sh;let th='<h3>选择天赋（3/10）</h3><div class="talent-count">已选：<span id="talentCount">0</span>/3</div><div class="talent-grid">';for(const t of talents){th+='<div class="talent-card" id="tcard_'+t.id+'" onclick="Game.toggleTalent(\''+t.id+'\')"><div class="talent-name">'+t.name+'</div><span class="talent-grade grade-'+t.grade+'">'+t.grade.toUpperCase()+'</span><div class="talent-desc">'+t.desc+'</div></div>'}th+='</div>';document.getElementById('talentSection').inne char.sect||'散修')+(char.sectAlign==='evil'?' [魔]':char.sectAlign==='righteous'?' [正]':'')+'</span></div><div class="stat-item"><span class="s-label">家境</span><span class="s-value">'+char.stats.family+'</span></div><div class="stat-item"><span class="s-label">智力</span><span class="s-value">'+char.stats.intelligence+'</span></div><div class="stat-item"><span class="s-label">体质</span><span class="s-value">'+char.stats.constitution+'</span></div><div class="stat-item"><span class="s-label">运气</span><span class="s-value">'+char.stats.luck+'</span></div><div class="title-list">'+char.titles.map(t=>'<span class="title-tag">'+t+'</span>').join('')+'</div><div style="margin-top:12px;font-size:12px;color:var(--text-dim);">天赋：'+char.talents.map(t=>t.name).join('、')+'</div>';document.getElementById('ageDisplay').textContent=char.age+'岁';document.getElementById('yearDisplay').textContent='境界：'+realm.name},addLogEntry(age,text,cssClass){const log=document.getElementById('eventLog');const div=document.createElement('div');div.className='log-entry '+(cssClass||'normal');div.innerHTML='<span class="log-year">'+age+'岁</span> '+text;log.appendChild(div);setTimeout(()=>{log.scrollTop=log.scrollHeight},50)},showControls(v){document.getElementById('simControls').style.display=v?'flex':'none'},showPausePrompt(age){document.getElementById('pausePrompt').style.display='flex';document.getElementById('pauseText').textContent='—— '+age+'岁，人生已推演至此 ——'},hidePausePrompt(){document.getElementById('pausePrompt').style.display='none'},showBreakthroughEffect(rn){this.showToast("突破！进入"+rn+"！");const fx=document.getElementById('fxLayer');for(let i=0;i<30;i++){setTimeout(()=>{const s=document.createElement('div');s.className='fx-spark';s.style.left=Utils.randInt(10,90)+'%';s.style.top=Utils.randInt(10,90)+'%';fx.appendChild(s);setTimeout(()=>s.remove(),1200)},i*30)}},showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('fxLayer').appendChild(t);setTimeout(()=>t.remove(),2500)},renderEnding(char){let grade;if(char.realmIndex>=19)grade="飞升真仙";else if(char.realmIndex>=17)grade="仙道至尊";else if(char.realmIndex>=14)grade="绝世天骄";else if(char.realmIndex>=11)grade="一方豪杰";else if(char.realmIndex>=5)grade="修仙有成";else if(char.realmIndex>=1)grade="初窥门径";else grade="泯然众人";const h='<div class="ending-title">'+char.name+' · 修仙录</div><div class="ending-grade">「'+grade+'」</div><div class="ending-section"><h3>基本信息</h3><p>享年：'+char.age+'岁 | 最终境界：'+char.getRealm().name+' | 灵根：'+char.spiritRoot.name+'</p><p>灵石：'+char.spiritStones+' | 声望：'+char.reputation+' | 宗门：'+(char.sect||'散修')+'</p><p>家境:'+char.stats.family+' 智力:'+char.stats.intelligence+' 体质:'+char.stats.constitution+' 运气:'+char.stats.luck+'</p></div><div class="ending-section"><h3>天赋</h3><p>'+char.talents.map(t=>t.name).join('、')+'</p></div><div class="ending-section"><h3>称号</h3><p>'+(char.titles.length?char.titles.join(' · '):'无')+'</p></div><div class="ending-section"><h3>人生大事记</h3><div class="ending-timeline">'+char.timeline.map(t=>'<div class="tl-item"><span class="tl-age">'+t.age+'岁</span>'+t.event+'</div>').join('')+'</div></div><div class="ending-section"><h3>结局</h3><p>'+(char.deathReason||"不明")+'</p></div><button class="btn-restart" onclick="Game.restart()">再入轮回</button>';document.getElementById('endingContent').innerHTML=h;UIManager.showScreen('endingScreen')}};

const Game={char:null,selectedTalentIds:[],createdTalents:[],startNewGame(){LifeSimulator.stop();this.char=new Character();this.char.init();this.selectedTalentIds=[];this.createdTalents=Utils.pickN(DATA.TALENTS,CONFIG.TALENT_POOL_SIZE);UIManager.renderCreateScreen(this.char,this.createdTalents);UIManager.showScreen('createScreen')},rerollName(){this.char.name=DATA.DAO_NAMES.generate();UIManager.renderCreateScreen(this.char,this.createdTalents);this.selectedTalentIds.forEach(id=>{const c=document.getElementById('tcard_'+id);if(c)c.classList.add('selected')});UIManager.updateTalentSelection(this.selectedTalentIds)},rerollRoot(){this.char.spiritRoot=DATA.SPIRIT_ROOTS.generate();UIManager.renderCreateScreen(this.char,this.createdTalents);this.selectedTalentIds.forEach(id=>{const c=document.getElementById('tcard_'+id);if(c)c.classList.add('selected')});UIManager.updateTalentSelection(this.selectedTalentIds)},adjustStat(stat,delta){if(this.char.allocateStat(stat,delta))UIManager.updateStatDisplay(this.char)},toggleTalent(id){const idx=this.selectedTalentIds.indexOf(id);if(idx>=0)this.selectedTalentIds.splice(idx,1);else if(this.selectedTalentIds.length<CONFIG.TALENT_SELECT_COUNT)this.selectedTalentIds.push(id);UIManager.updateTalentSelection(this.selectedTalentIds)},confirmCreate(){if(this.selectedTalentIds.length!==CONFIG.TALENT_SELECT_COUNT)return;this.char.talents=this.createdTalents.filter(t=>this.selectedTalentIds.includes(t.id));this.char.applyTalentEffects();this.char.lifespan=CONFIG.INITIAL_LIFESPAN+(this.char.stats.constitution-1)*3;this.char.maxLifespan=this.char.lifespan;this.char.spiritStones=CONFIG.INITIAL_SPIRIT_STONES+(this.char.stats.family-1)*20;for(const t of this.char.talents){if(t.effects.lifespanBonus){this.char.lifespan+=t.effects.lifespanBonus;this.char.maxLifespan+=t.effects.lifespanBonus}}LifeSimulator.start(this.char)},restart(){LifeSimulator.stop();this.char=null;this.selectedTalentIds=[];this.createdTalents=[];UIManager.showScreen('homeScreen') (function(){const canvas=document.getElementById('bgCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');let particles=[];function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();for(let i=0;i<60;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+0.5,speedX:(Math.random()-0.5)*0.3,speedY:(Math.random()-0.5)*0.3-0.1,opacity:Math.random()*0.5+0.1})}function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of particles){p.x+=p.speedX;p.y+=p.speedY;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle='rgba(212,165,116,'+p.opacity+')';ctx.fill()}requestAnimationFrame(animate)}animate()})();
